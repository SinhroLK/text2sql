[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-research"
version = "0.5.0"
description = "Reproducible Text-to-SQL research pipeline for a master thesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dspy==3.3.1",
  "groq==1.6.0",
  "litellm==1.99.0",
  "optuna==4.9.0",
]

[project.scripts]
text2sql = "text2sql.cli:main"
text2sql-prepare-spider2 = "text2sql.datasets.cli:main"
text2sql-evaluate = "text2sql.evaluation.cli:main"
text2sql-evaluate-spider2 = "text2sql.evaluation.spider2_cli:main"
text2sql-run-baseline = "text2sql.experiments.cli:main"
text2sql-audit-linking = "text2sql.experiments.linking_cli:main"
text2sql-audit-retrieval = "text2sql.experiments.retrieval_cli:main"
text2sql-audit-semantic-errors = "text2sql.analysis.cli:main"
text2sql-prepare-retrieval = "text2sql.retrieval.cli:main"
text2sql-optimize-b5 = "text2sql.optimization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
