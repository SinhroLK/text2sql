[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-research"
version = "0.5.0"
description = "Reproducible Text-to-SQL research pipeline for a master thesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["groq==1.6.0"]

[project.scripts]
text2sql = "text2sql.cli:main"
text2sql-prepare-spider2 = "text2sql.datasets.cli:main"
text2sql-evaluate = "text2sql.evaluation.cli:main"
text2sql-evaluate-spider2 = "text2sql.evaluation.spider2_cli:main"
text2sql-run-baseline = "text2sql.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
